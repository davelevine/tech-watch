<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Watch · AI, architecture and security news</title>
<meta name="description" content="Daily tech news on AI, security, architecture, SDLC and regulation, summarized.">
<link rel="alternate" type="application/rss+xml" title="Tech Watch" href="/rss.xml">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230a0b0d'/><circle cx='16' cy='16' r='6' fill='%2373dbcc'/></svg>">
<script>document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
<style>
  :root {
    color-scheme: light;
    --bg: #eceef1; --bg-card: #f8f9fb; --bg-card-hover: #f2f4f7; --border: #d8dce2; --border-strong: #bcc3cc;
    --text: #121418; --text-muted: #5a616b; --accent: #0d6b66; --accent-soft: #dfe9e6; --accent-contrast: #fff;
    --header-bg: rgba(236, 238, 241, .88); --toggle-bg: #d8dce2; --tag-text: #0a5652;
    --cat-security: #9b4251; --cat-ai: #7a4d94; --cat-architecture: #026a9d; --cat-sdlc: #5d57a4; --cat-regulation: #8e5300; --cat-other: #5d646f;
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --read: 860px;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a0b0d; --bg-card: #121417; --bg-card-hover: #181b1f; --border: #24282e; --border-strong: #373c44;
    --text: #f3f4f6; --text-muted: #9aa1ab; --accent: #73dbcc; --accent-soft: #0e2a2a; --accent-contrast: #0a0b0d;
    --header-bg: rgba(10, 11, 13, .88); --toggle-bg: #24282e; --tag-text: #9ae6da;
    --cat-security: #f7a3ad; --cat-ai: #d3abed; --cat-architecture: #80c7f8; --cat-sdlc: #b7b5fc; --cat-regulation: #ebb077; --cat-other: #b6becb;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  header { position: sticky; top: 0; z-index: 100; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
    border-bottom: 1px solid var(--border); background: var(--header-bg); backdrop-filter: blur(16px) saturate(1.35); -webkit-backdrop-filter: blur(16px) saturate(1.35); }
  .logo { font-size: 17px; font-weight: 760; letter-spacing: -.025em; }
  .logo span { color: var(--accent); }
  .controls { display: flex; align-items: center; gap: 6px; }
  .icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid transparent; border-radius: var(--radius-sm); background: none; color: var(--text-muted); cursor: pointer; }
  .icon-btn svg { width: 17px; height: 17px; }
  .theme-toggle { display: flex; align-items: center; gap: 5px; height: 36px; padding: 0 7px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-card); color: var(--text-muted); cursor: pointer; }
  .theme-toggle svg { width: 14px; height: 14px; }
  .track { position: relative; width: 36px; height: 20px; border-radius: 999px; background: var(--toggle-bg); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--border-strong) 45%, transparent); }
  .thumb { position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(15, 23, 42, .28); transition: transform .18s cubic-bezier(.2, 0, 0, 1); }
  [data-theme="dark"] .thumb { transform: translateX(16px); }

  .subheader { position: sticky; top: 52px; z-index: 99; padding: 10px 20px 12px; border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(16px) saturate(1.25); -webkit-backdrop-filter: blur(16px) saturate(1.25); }
  .search-wrap, .filters { max-width: calc(var(--read) - 48px); margin: 0 auto; }
  .search-wrap { position: relative; }
  .search-wrap > svg { position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  #search { width: 100%; padding: 8px 36px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-card); color: var(--text); font: inherit; font-size: .875rem; outline: none; }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--text-muted); }
  #search::-webkit-search-cancel-button { display: none; }
  .clear-btn { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); display: none; }
  .search-wrap.has-value .clear-btn { display: inline-grid; }
  .filters { display: flex; gap: 8px; padding-top: 14px; overflow-x: auto; scrollbar-width: none; }
  .filter-btn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 5px 14px; border: 1px solid var(--border); border-radius: var(--radius-lg);
    background: var(--bg-card); color: var(--text-muted); font-size: .8125rem; font-weight: 500; cursor: pointer; }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .dot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 999px; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 14%, transparent); }

  .weekly { max-width: var(--read); margin: 0 auto; padding: 18px 24px 0; }
  .weekly[hidden] { display: none; }
  .weekly-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .weekly-heading { position: relative; display: flex; align-items: center; gap: 8px; min-height: 32px; }
  .weekly-title { font-size: 1.125rem; font-weight: 700; }
  .info-btn { display: grid; place-items: center; width: 22px; height: 22px; border: 1px solid currentColor; border-radius: 999px; background: none; color: var(--text-muted); font-size: .6875rem; font-weight: 700; cursor: pointer; }
  .info-btn[aria-expanded="true"] { color: var(--accent); }
  .popover { position: absolute; top: calc(100% + 6px); left: 0; z-index: 50; width: min(320px, 80vw); padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--bg-card); box-shadow: 0 24px 64px rgba(0, 0, 0, .25); color: var(--text-muted); font-size: .8125rem; line-height: 1.5; }
  .popover[hidden] { display: none; }
  .nav { display: flex; gap: 8px; }
  .nav-btn { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg-card); color: var(--text); cursor: pointer; }
  .nav-btn:disabled { cursor: default; opacity: .45; }
  .nav-btn svg { width: 16px; height: 16px; stroke-width: 2.2; }
  .rail { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding: 1px 1px 4px; scrollbar-width: none; }
  .rail::-webkit-scrollbar, .filters::-webkit-scrollbar { display: none; }
  .weekly-card { flex: 0 0 calc((100% - 20px) / 3); min-width: 220px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 7px; padding: 12px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); }
  .weekly-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; color: var(--text-muted); font-size: .75rem; }
  .rank, .count { flex: 0 0 auto; min-width: 24px; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--tag-text); text-align: center; font-weight: 700; }
  .weekly-meta { display: flex; justify-content: flex-end; gap: 4px; min-width: 0; white-space: nowrap; }
  .weekly-source { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .weekly-card-title { font-size: .875rem; line-height: 1.28; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

  .items { max-width: var(--read); margin: 0 auto; padding: 14px 24px 48px; display: flex; flex-direction: column; gap: 7px; }
  .date-label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 0 1px; padding: 8px 0 6px; border-bottom: 1px solid var(--border);
    color: var(--text-muted); font-size: .6875rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
  .count { font-size: .6875rem; letter-spacing: 0; }
  .card { content-visibility: auto; contain-intrinsic-block-size: auto 5rem; display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); }
  .card .dot { width: 9px; height: 9px; margin-top: 6px; }
  .card-body { flex: 1; min-width: 0; }
  .card-title { margin-bottom: 3px; font-size: .9375rem; font-weight: 600; line-height: 1.4; }
  .card-summary { margin-bottom: 5px; color: var(--text-muted); font-size: .8125rem; line-height: 1.5; }
  .card-meta { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--text-muted); font-size: .75rem; }
  .card-cat { flex: 0 0 auto; font-weight: 700; }
  .card-url { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-arrow { flex-shrink: 0; margin-top: 2px; color: var(--text-muted); transition: transform .15s, color .15s; }
  .card-arrow svg { width: 16px; height: 16px; }
  mark { background: var(--accent-soft); color: inherit; border-radius: 2px; }
  .empty { padding: 60px 24px; color: var(--text-muted); text-align: center; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) {
    .icon-btn:hover { border-color: var(--border); background: var(--bg-card-hover); color: var(--accent); }
    .theme-toggle:hover, .nav-btn:not(:disabled):hover { border-color: var(--border-strong); background: var(--bg-card-hover); }
    .filter-btn:not(.active):hover { border-color: var(--border-strong); color: var(--text); }
    .card:hover, .weekly-card:hover { background: var(--bg-card-hover); border-color: var(--border-strong); }
    .card:hover .card-arrow { transform: translateX(3px); color: var(--accent); }
  }
  @media (max-width: 640px) {
    header { padding: 0 14px; }
    .subheader { padding: 8px 14px; }
    .filters { margin-right: -14px; padding-top: 10px; }
    .filter-btn { min-height: 40px; }
    .weekly, .items { padding-left: 14px; padding-right: 14px; }
    .weekly-title { font-size: .9375rem; }
    .nav { display: none; }
    .rail { margin-right: -14px; padding-right: 14px; }
    .weekly-card { flex-basis: min(82vw, 300px); }
    .card { padding: 12px; gap: 10px; }
    .card-title { font-size: .875rem; }
  }
</style>
</head>
<body>
<header>
  <a class="logo" href="/">Tech <span>Watch</span></a>
  <div class="controls">
    <a class="icon-btn" href="/rss.xml" title="RSS feed" aria-label="RSS feed">
      <svg viewBox="0 0 24 24"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
    </a>
    <button class="theme-toggle" id="theme" type="button" aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span class="track"><span class="thumb"></span></span>
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
<div class="subheader">
  <div class="search-wrap" id="search-wrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search..." aria-label="Search" autocomplete="off">
    <button class="icon-btn clear-btn" id="clear" type="button" aria-label="Clear search"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="filters" id="filters"></div>
</div>
<section class="weekly" id="weekly" hidden>
  <div class="weekly-header">
    <div class="weekly-heading">
      <h2 class="weekly-title">This week’s essentials</h2>
      <button class="info-btn" id="info" type="button" aria-expanded="false" aria-controls="info-pop" aria-label="About this selection">i</button>
      <div class="popover" id="info-pop" hidden>Five stories from the last seven days, picked by an LLM and refreshed daily. Hover a card to see why it made the cut.</div>
    </div>
    <div class="nav">
      <button class="nav-btn" id="prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="nav-btn" id="next" type="button" aria-label="Next"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </div>
  <div class="rail" id="rail"></div>
</section>
<main class="items" id="items"><p class="empty">Loading articles…</p></main>
<script>
const CATS = { security: 'Security', ai: 'AI', architecture: 'Architecture', sdlc: 'SDLC', regulation: 'Regulation', other: 'Other' };
const SHORT = { architecture: 'Arch' };
const ORDER = ['ai', 'architecture', 'sdlc', 'security', 'regulation', 'other'];
const ARROW = '<svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const cat = c => (c in CATS ? c : 'other');
const domain = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
let items = [], filter = 'all';

function dayLabel(iso) {
  const days = Math.round((new Date().setHours(0, 0, 0, 0) - new Date(iso + 'T00:00:00')) / 864e5);
  if (days <= 0) return 'Today';
  if (days === 1) return 'Yesterday';
  const d = new Date(iso + 'T12:00:00');
  return days < 7 ? d.toLocaleDateString('en-US', { weekday: 'long' }) : d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
}

function highlight(text, q) {
  const s = esc(text);
  if (!q) return s;
  const re = new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  return s.replace(re, m => `<mark>${m}</mark>`);
}

function renderFilters() {
  const counts = {};
  for (const i of items) counts[cat(i.category)] = (counts[cat(i.category)] || 0) + 1;
  $('filters').innerHTML = [`<button class="filter-btn${filter === 'all' ? ' active' : ''}" data-f="all">All</button>`]
    .concat(ORDER.filter(c => counts[c]).map(c => `<button class="filter-btn${filter === c ? ' active' : ''}" data-f="${c}">` +
      `<span class="dot" style="--c:var(--cat-${c})"></span>${SHORT[c] || CATS[c]} (${counts[c]})</button>`)).join('');
}

function renderItems() {
  const q = $('search').value.trim();
  const ql = q.toLowerCase();
  $('search-wrap').classList.toggle('has-value', !!q);
  const shown = items.filter(i => (filter === 'all' || cat(i.category) === filter) &&
    (!ql || `${i.title} ${i.summary} ${i.publisher} ${domain(i.url)}`.toLowerCase().includes(ql)));
  const groups = {};
  for (const i of shown) (groups[i.date] ||= []).push(i);
  $('items').innerHTML = shown.length ? Object.entries(groups).map(([d, list]) => `
    <div class="date-label"><span>${dayLabel(d)}</span><span class="count">${list.length}</span></div>
    ${list.map(i => { const c = cat(i.category); return `
    <a class="card" href="${esc(i.url)}" target="_blank" rel="noopener">
      <span class="dot" style="--c:var(--cat-${c})"></span>
      <div class="card-body">
        <div class="card-title">${highlight(i.title, q)}</div>
        ${i.summary ? `<p class="card-summary">${highlight(i.summary, q)}</p>` : ''}
        <div class="card-meta"><span class="card-cat" style="color:var(--cat-${c})">${CATS[c]}</span><span>·</span><span class="card-url">${esc(domain(i.url))}</span></div>
      </div>
      <span class="card-arrow">${ARROW}</span>
    </a>`; }).join('')}`).join('')
    : '<p class="empty">No articles match your search.</p>';
}

function renderWeekly(weekly) {
  const byUrl = Object.fromEntries(items.map(i => [i.url, i]));
  const picks = (weekly?.items || []).filter(p => byUrl[p.url]);
  if (!picks.length) return;
  $('rail').innerHTML = picks.map((p, n) => { const i = byUrl[p.url]; return `
    <a class="weekly-card" href="${esc(i.url)}" target="_blank" rel="noopener" title="${esc(p.why)}">
      <div class="weekly-top"><span class="rank">${n + 1}</span>
        <span class="weekly-meta"><span class="weekly-source">${esc(i.publisher)}</span><span>· ${CATS[cat(i.category)]} · ${dayLabel(i.date)}</span></span></div>
      <div class="weekly-card-title">${esc(i.title)}</div>
    </a>`; }).join('');
  $('weekly').hidden = false;
  const rail = $('rail');
  const step = () => rail.firstElementChild.offsetWidth + 10;
  const sync = () => { $('prev').disabled = rail.scrollLeft < 4; $('next').disabled = rail.scrollLeft + rail.clientWidth >= rail.scrollWidth - 4; };
  $('prev').onclick = () => rail.scrollBy({ left: -step() });
  $('next').onclick = () => rail.scrollBy({ left: step() });
  rail.onscroll = sync;
  sync();
}

$('theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  localStorage.setItem('theme', t);
};
$('info').onclick = e => {
  e.stopPropagation();
  const open = $('info-pop').hidden;
  $('info-pop').hidden = !open;
  $('info').setAttribute('aria-expanded', open);
};
document.addEventListener('click', () => { $('info-pop').hidden = true; $('info').setAttribute('aria-expanded', false); });
$('filters').onclick = e => {
  const b = e.target.closest('.filter-btn');
  if (!b) return;
  filter = b.dataset.f;
  renderFilters();
  renderItems();
};
$('search').oninput = renderItems;
$('clear').onclick = () => { $('search').value = ''; renderItems(); $('search').focus(); };

fetch('data.json', { cache: 'no-cache' }).then(r => r.json()).then(data => {
  items = data.items || [];
  renderFilters();
  renderWeekly(data.weekly);
  renderItems();
}).catch(() => { $('items').innerHTML = '<p class="empty">Couldn’t load the news. Try again in a bit.</p>'; });
</script>
</body>
</html>
