<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triage · AI, architecture and security news</title>
<meta name="description" content="Daily tech news on AI, security, architecture, SDLC and regulation, summarized.">
<link rel="alternate" type="application/rss+xml" title="Triage" href="/rss.xml">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#18191d">
<script>document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
<style>
  :root, [data-theme="light"] {
    color-scheme: light;
    --bg: #e8ebf0; --bg-card: #f3f5f8; --bg-card-hover: #eceff3; --border: #d3d8e0; --border-strong: #b6bdc9;
    --text: #1c1f27; --urgent: #d9485a; --text-muted: #586172; --accent: #0d6b66; --accent-soft: #d7e7e5; --accent-contrast: #fff;
    --header-bg: rgba(232, 235, 240, .88); --toggle-bg: #6b7484; --tag-text: #0a5652;
    --cat-security: #9b4251; --cat-ai: #7a4d94; --cat-architecture: #026a9d; --cat-sdlc: #5d57a4; --cat-regulation: #8e5300; --cat-other: #5d646f;
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --read: 860px;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #18191d; --bg-card: #212227; --bg-card-hover: #292a31; --border: #2f3037; --border-strong: #42444e;
    --text: #eceff4; --urgent: #f2777a; --text-muted: #a3abbb; --accent: #73dbcc; --accent-soft: #1d3b3e; --accent-contrast: #18191d;
    --header-bg: rgba(24, 25, 29, .88); --toggle-bg: #2f3037; --tag-text: #9ae6da;
    --cat-security: #f7a3ad; --cat-ai: #d3abed; --cat-architecture: #80c7f8; --cat-sdlc: #b7b5fc; --cat-regulation: #ebb077; --cat-other: #b6becb;
  }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Theme switch: colors change in one frame and a view transition crossfades the page (see app.js). */
  [data-theme="dark"] .only-light, [data-theme="light"] .only-dark { display: none; }
  .theme-switching *, .theme-switching *::before, .theme-switching *::after { transition: none !important; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .35s; animation-timing-function: ease; }
  html { scrollbar-gutter: stable; scroll-padding-top: 170px; }  /* the reader locks scrolling; keep the scrollbar's space so nothing shifts */
  * { -webkit-tap-highlight-color: transparent; }  /* Android paints it above the reader that opens on tap */
  body { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  header { position: sticky; top: 0; z-index: 100; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
    border-bottom: 1px solid var(--border); background: var(--header-bg); backdrop-filter: blur(16px) saturate(1.35); -webkit-backdrop-filter: blur(16px) saturate(1.35); }
  .logo { display: flex; align-items: center; min-height: 44px; }
  .logo svg { height: 26px; stroke: none; }
  .logo .fg { fill: var(--text); }
  .logo .dot { fill: var(--urgent); }
  .controls { display: flex; align-items: center; gap: 6px; }
  .updated { color: var(--text-muted); font-size: 12px; white-space: nowrap; margin-right: 4px; }
  .icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid transparent; border-radius: var(--radius-sm); background: none; color: var(--text-muted); cursor: pointer; }
  .icon-btn svg { width: 17px; height: 17px; }
  .theme-toggle { display: flex; align-items: center; gap: 5px; height: 36px; padding: 0 7px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-card); color: var(--text-muted); cursor: pointer; }
  .theme-toggle svg { width: 14px; height: 14px; }
  .track { position: relative; width: 36px; height: 20px; border-radius: 999px; background: var(--toggle-bg); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--border-strong) 45%, transparent); }
  .thumb { position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(15, 23, 42, .28); transition: transform .18s cubic-bezier(.2, 0, 0, 1); }
  [data-theme="dark"] .thumb { transform: translateX(16px); }

  .subheader { position: sticky; top: 52px; z-index: 99; padding: 10px 20px 12px; border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(16px) saturate(1.25); -webkit-backdrop-filter: blur(16px) saturate(1.25); }
  .search-wrap, .filters { max-width: calc(var(--read) - 48px); margin: 0 auto; }
  .search-wrap { position: relative; }
  .search-wrap > svg { position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  #search { width: 100%; padding: 8px 64px 8px 36px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-card); color: var(--text); font: inherit; font-size: .875rem; outline: none; }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--text-muted); }
  #search::-webkit-search-cancel-button { display: none; }
  .clear-btn { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); display: none; }
  .search-wrap.has-value .clear-btn { display: inline-grid; }
  kbd { padding: 3px 6px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 5px; background: var(--bg); color: var(--text-muted); font: 600 .7rem/1 Inter, system-ui, sans-serif; white-space: nowrap; }
  .search-kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .search-wrap.has-value .search-kbd { display: none; }
  .palette-backdrop { position: fixed; inset: 0; z-index: 300; background: rgba(0, 0, 0, .5); }
  .palette { position: fixed; z-index: 301; top: 12vh; left: 50%; transform: translateX(-50%); width: min(640px, calc(100vw - 24px)); max-height: 70vh; display: flex; flex-direction: column;
    overflow: hidden; background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); box-shadow: 0 24px 64px rgba(0, 0, 0, .35); }
  .palette-input { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--border); }
  .palette-input svg { flex: none; width: 18px; height: 18px; color: var(--text-muted); }
  #palette-q { flex: 1; min-width: 0; height: 52px; border: 0; outline: none; background: none; color: var(--text); font: inherit; font-size: 1rem; }
  #palette-q::placeholder { color: var(--text-muted); }
  .palette-list { margin: 0; padding: 6px; list-style: none; overflow-y: auto; }
  .palette-list li { display: flex; align-items: flex-start; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm); cursor: pointer; }
  .palette-list li[aria-selected="true"] { background: var(--accent-soft); }
  .palette-list .dot { margin-top: 6px; }
  .p-title { font-size: .9rem; font-weight: 600; line-height: 1.35; }
  .p-meta { margin-top: 2px; color: var(--text-muted); font-size: .75rem; }
  .palette-list .palette-empty { justify-content: center; padding: 22px; color: var(--text-muted); font-size: .875rem; cursor: default; }
  .palette-foot { display: flex; gap: 16px; padding: 8px 14px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: .72rem; }
  .palette-foot kbd { margin-right: 3px; }
  .filters { display: flex; gap: 8px; padding-top: 14px; min-height: 48px;  /* the chips arrive with the data; hold their row */ overflow-x: auto; scrollbar-width: none; }
  .filter-btn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 5px 14px; border: 1px solid var(--border); border-radius: var(--radius-lg);
    background: var(--bg-card); color: var(--text-muted); font-size: .8125rem; font-weight: 500; cursor: pointer; }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .dot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 999px; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 14%, transparent); }

  .weekly { max-width: var(--read); margin: 0 auto; padding: 18px 24px 0; }
  .weekly[hidden] { display: none; }
  .weekly-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .weekly-heading { position: relative; display: flex; align-items: center; gap: 8px; min-height: 32px; }
  .weekly-title { font-size: 1.125rem; font-weight: 700; }
  .info-btn { display: grid; place-items: center; width: 22px; height: 22px; border: 1px solid currentColor; border-radius: 999px; background: none; color: var(--text-muted); font-size: .6875rem; font-weight: 700; cursor: pointer; }
  .info-btn { position: relative; }
  .info-btn::after { content: ""; position: absolute; inset: -11px; }  /* 44px target around the 22px circle */
  .info-btn[aria-expanded="true"] { color: var(--accent); }
  .popover { position: absolute; top: calc(100% + 6px); left: 0; z-index: 50; width: min(320px, 80vw); padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--bg-card); box-shadow: 0 24px 64px rgba(0, 0, 0, .25); color: var(--text-muted); font-size: .8125rem; line-height: 1.5; }
  .popover[hidden] { display: none; }
  .nav { display: flex; gap: 8px; }
  .nav-btn { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg-card); color: var(--text); cursor: pointer; }
  .nav-btn:disabled { cursor: default; opacity: .45; }
  .nav-btn svg { width: 16px; height: 16px; stroke-width: 2.2; }
  .rail { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 1px; scroll-behavior: smooth; padding: 1px 1px 4px; scrollbar-width: none; }
  .rail::-webkit-scrollbar, .filters::-webkit-scrollbar { display: none; }
  .weekly-card { flex: 0 0 calc((100% - 20px) / 3); min-width: 220px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 7px; padding: 12px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); }
  .weekly-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; color: var(--text-muted); font-size: .75rem; }
  .rank, .count { flex: 0 0 auto; min-width: 24px; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--tag-text); text-align: center; font-weight: 700; }
  .weekly-meta { display: flex; justify-content: flex-end; gap: 4px; min-width: 0; white-space: nowrap; }
  .weekly-source { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .weekly-card-title { font-size: .875rem; line-height: 1.28; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;  min-height: calc(1.28em * 4);}

  .items { max-width: var(--read); margin: 0 auto; padding: 14px 24px 48px; display: flex; flex-direction: column; gap: 7px; }
  .date-label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 0 1px; padding: 8px 0 6px; border-bottom: 1px solid var(--border);
    color: var(--text-muted); font-size: .6875rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
  .count { font-size: .6875rem; letter-spacing: 0; }
  .card { content-visibility: auto; contain-intrinsic-block-size: auto 5rem; display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); }
  .card .dot { width: 9px; height: 9px; margin-top: 6px; }
  .card-body { flex: 1; min-width: 0; }
  .card-title { margin-bottom: 3px; font-size: .9375rem; font-weight: 600; line-height: 1.4; }
  .card-summary { margin-bottom: 5px; color: var(--text-muted); font-size: .8125rem; line-height: 1.5; }
  .card-meta { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--text-muted); font-size: .75rem; }
  .card-cat { flex: 0 0 auto; font-weight: 700; }
  .card-url { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-time { flex: 0 0 auto; white-space: nowrap; }
  .card-arrow { flex-shrink: 0; margin-top: 2px; color: var(--text-muted); transition: transform .15s, color .15s; }
  .card-arrow svg { width: 16px; height: 16px; }
  mark { background: var(--accent-soft); color: inherit; border-radius: 2px; }
  .back-to-top { position: fixed; right: 24px; bottom: 24px; z-index: 90; display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--accent);
    border-radius: 999px; background: var(--bg-card); color: var(--accent); cursor: pointer; box-shadow: 0 8px 24px rgba(0, 0, 0, .2); }
  .back-to-top[hidden] { display: none; }
  .back-to-top svg { width: 18px; height: 18px; }
  .card.read .card-title { color: var(--text-muted); font-weight: 500; }
  .new { flex: 0 0 auto; padding: 1px 7px; border-radius: 999px; background: var(--accent); color: var(--accent-contrast); font-size: .66rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .skeleton { pointer-events: none; }
  .skeleton .bone { display: block; height: .8em; border-radius: 6px; background: var(--border); animation: pulse 1.4s ease-in-out infinite; }
  .skeleton .bone.title { height: 1em; margin-bottom: .4em; }
  .skeleton.card { min-height: 104px; }
  @keyframes pulse { 50% { opacity: .45; } }
  .empty { padding: 60px 24px; color: var(--text-muted); text-align: center; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Inline on wide screens; a popover behind the menu button on phones. The browser handles opening and dismissing it. */
  .menu { position: static; display: flex; align-items: center; gap: 6px; width: auto; height: auto; margin: 0; padding: 0; border: 0; background: none; color: inherit; overflow: visible; }
  .menu-btn, .menu-label { display: none; }
  @media (max-width: 480px) {
    .menu-btn { display: inline-grid; }
    .menu-btn:has(+ .menu:popover-open) { background: var(--bg-card-hover); color: var(--text); }
    /* A drawer: full width under the header, its bottom edge wiping down while the rows stay still. */
    .menu { flex-direction: column; align-items: stretch; gap: 0; position: fixed; inset: 52px 0 auto; width: 100%; padding: 4px; border-bottom: 1px solid var(--border-strong);
      background: var(--bg); box-shadow: 0 12px 24px rgba(0, 0, 0, .25); clip-path: inset(0 0 100% 0);
      transition: clip-path .22s cubic-bezier(.2, 0, 0, 1), display .22s allow-discrete, overlay .22s allow-discrete; }
    .menu::backdrop { top: 52px; background: transparent; transition: background .22s ease, display .22s allow-discrete, overlay .22s allow-discrete; }
    .menu:not(:popover-open) { display: none; }
    body:has(.menu:popover-open) > :not(header) { pointer-events: none; }  /* a tap outside only closes the menu; it doesn't open the card underneath */
    .menu:popover-open { clip-path: inset(0 0 -40px 0); }
    .menu:popover-open::backdrop { background: rgba(0, 0, 0, .45); }
    @starting-style {
      .menu:popover-open { clip-path: inset(0 0 100% 0); }
      .menu:popover-open::backdrop { background: transparent; }
    }
    .menu .icon-btn, .menu .theme-toggle { display: flex; align-items: center; justify-content: flex-start; gap: 12px; width: 100%; height: 48px; padding: 0 10px; border: 0; border-radius: var(--radius-sm);
      background: none; color: var(--text-muted); font: inherit; text-align: left; }
    .menu .icon-btn svg, .menu .theme-toggle > svg { width: 22px; height: 22px; flex: none; }
    .menu .icon-btn:active, .menu .theme-toggle:active { background: var(--bg-card-hover); }
    .menu-label { display: inline; color: var(--text); font-size: 16px; font-weight: 500; }
    /* A settings row: moon, label, then the switch. */
    .menu .theme-toggle { position: relative; margin-top: 7px; }
    .menu .theme-toggle::before { content: ""; position: absolute; inset: -4px 4px auto; border-top: 1px solid var(--border); }
    .menu .theme-toggle > svg:first-child { display: none; }
    .menu .theme-toggle > svg:last-child { order: -2; }
    .menu .theme-toggle .menu-label { order: -1; margin-right: auto; }
    [data-theme="dark"] .menu .track { background: var(--accent); }
    [data-theme="dark"] .menu .thumb { background: var(--accent-contrast); }
  }
  @media (hover: hover) {
    .icon-btn:hover { border-color: var(--border); background: var(--bg-card-hover); color: var(--accent); }
    .theme-toggle:hover, .nav-btn:not(:disabled):hover { border-color: var(--border-strong); background: var(--bg-card-hover); }
    .filter-btn:not(.active):hover { border-color: var(--border-strong); color: var(--text); }
    .card:hover, .weekly-card:hover { background: var(--bg-card-hover); border-color: var(--border-strong); }
    .card:hover .card-arrow { transform: translateX(3px); color: var(--accent); }
  }
  @media (max-width: 640px) {
    header { padding: 0 14px; }
    .subheader { padding: 8px 14px; }
    .filters { margin-right: -14px; padding-top: 10px; min-height: 54px; }
    .filter-btn { min-height: 44px; }
    .icon-btn, .nav-btn { width: 44px; height: 44px; }
    .icon-btn svg { width: 24px; height: 24px; }
    .theme-toggle { height: 44px; }
    #search { min-height: 44px; font-size: 1rem; }
    .palette-list li { min-height: 44px; }
    .reader-msg a { padding: 12px 18px; }
    .weekly, .items { padding-left: 14px; padding-right: 14px; }
    .weekly-title { font-size: .9375rem; }
    .nav { display: none; }
    .rail { margin-right: -14px; padding-right: 14px; }
    .weekly-card { flex-basis: min(82vw, 300px); }
    .card { padding: 12px; gap: 10px; }
    .card-title { font-size: .875rem; }
    .back-to-top { right: 12px; bottom: 12px; }
    .palette { top: 8px; max-height: calc(100vh - 16px); }
    .palette-foot { display: none; }
  }
  .reader-backdrop { position: fixed; inset: 0; z-index: 200; background: rgba(0, 0, 0, .45); opacity: 0; pointer-events: none; transition: opacity .18s; }
  .reader { position: fixed; top: 0; right: 0; bottom: 0; z-index: 201; width: min(820px, 100vw); display: flex; flex-direction: column;
    background: var(--bg); border-left: 1px solid var(--border); box-shadow: 0 24px 64px rgba(0, 0, 0, .3); transform: translateX(100%); visibility: hidden;
    transition: transform .22s cubic-bezier(.2, 0, 0, 1), visibility 0s .22s; }
  body.reading { overflow: hidden; }
  body.reading .reader-backdrop { opacity: calc(1 - var(--drag, 0)); pointer-events: auto; }
  body.reading .reader { transform: translateX(calc(var(--drag, 0) * 100%)); visibility: visible; transition: transform .22s cubic-bezier(.2, 0, 0, 1); }
  body.dragging .reader, body.dragging .reader-backdrop, body.dragging .feed { transition: none !important; }
  /* Phones: the feed slides aside under the reader and follows a swipe back, like a native back gesture. */
  @media (max-width: 640px) {
    .feed { transition: transform .22s cubic-bezier(.2, 0, 0, 1); }
    body.reading .feed { transform: translateX(calc(-25% * (1 - var(--drag, 0)))); }
  }
  .reader-bar { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 12px; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
  .reader-source:hover { color: var(--accent); }
  .reader-source { flex: 1; min-width: 0; line-height: 44px; color: var(--text-muted); font-size: .8125rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reader-body { position: relative; flex: 1; min-height: 0; }
  .reader-body iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
  .reader-msg { display: grid; place-content: center; gap: 14px; height: 100%; padding: 24px; color: var(--text-muted); text-align: center; }
  .reader-msg a { justify-self: center; padding: 8px 16px; border: 1px solid var(--accent); border-radius: 999px; color: var(--accent); font-weight: 600; }
</style>
</head>
