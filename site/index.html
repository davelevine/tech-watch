<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Watch · AI, architecture and security news</title>
<meta name="description" content="Daily tech news on AI, security, architecture, SDLC and regulation, summarized.">
<link rel="alternate" type="application/rss+xml" title="Tech Watch" href="/rss.xml">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a0b0d">
<script>document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
<style>
  :root {
    color-scheme: light;
    --bg: #eceef1; --bg-card: #f8f9fb; --bg-card-hover: #f2f4f7; --border: #d8dce2; --border-strong: #bcc3cc;
    --text: #121418; --text-muted: #5a616b; --accent: #0d6b66; --accent-soft: #dfe9e6; --accent-contrast: #fff;
    --header-bg: rgba(236, 238, 241, .88); --toggle-bg: #d8dce2; --tag-text: #0a5652;
    --cat-security: #9b4251; --cat-ai: #7a4d94; --cat-architecture: #026a9d; --cat-sdlc: #5d57a4; --cat-regulation: #8e5300; --cat-other: #5d646f;
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --read: 860px;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a0b0d; --bg-card: #121417; --bg-card-hover: #181b1f; --border: #24282e; --border-strong: #373c44;
    --text: #f3f4f6; --text-muted: #9aa1ab; --accent: #73dbcc; --accent-soft: #0e2a2a; --accent-contrast: #0a0b0d;
    --header-bg: rgba(10, 11, 13, .88); --toggle-bg: #24282e; --tag-text: #9ae6da;
    --cat-security: #f7a3ad; --cat-ai: #d3abed; --cat-architecture: #80c7f8; --cat-sdlc: #b7b5fc; --cat-regulation: #ebb077; --cat-other: #b6becb;
  }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html { scrollbar-gutter: stable; }  /* the reader locks scrolling; keep the scrollbar's space so nothing shifts */
  body { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  header { position: sticky; top: 0; z-index: 100; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
    border-bottom: 1px solid var(--border); background: var(--header-bg); backdrop-filter: blur(16px) saturate(1.35); -webkit-backdrop-filter: blur(16px) saturate(1.35); }
  .logo { font-size: 17px; font-weight: 760; letter-spacing: -.025em; }
  .logo span { color: var(--accent); }
  .controls { display: flex; align-items: center; gap: 6px; }
  .icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid transparent; border-radius: var(--radius-sm); background: none; color: var(--text-muted); cursor: pointer; }
  .icon-btn svg { width: 17px; height: 17px; }
  .theme-toggle { display: flex; align-items: center; gap: 5px; height: 36px; padding: 0 7px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-card); color: var(--text-muted); cursor: pointer; }
  .theme-toggle svg { width: 14px; height: 14px; }
  .track { position: relative; width: 36px; height: 20px; border-radius: 999px; background: var(--toggle-bg); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--border-strong) 45%, transparent); }
  .thumb { position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(15, 23, 42, .28); transition: transform .18s cubic-bezier(.2, 0, 0, 1); }
  [data-theme="dark"] .thumb { transform: translateX(16px); }

  .subheader { position: sticky; top: 52px; z-index: 99; padding: 10px 20px 12px; border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(16px) saturate(1.25); -webkit-backdrop-filter: blur(16px) saturate(1.25); }
  .search-wrap, .filters { max-width: calc(var(--read) - 48px); margin: 0 auto; }
  .search-wrap { position: relative; }
  .search-wrap > svg { position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  #search { width: 100%; padding: 8px 64px 8px 36px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-card); color: var(--text); font: inherit; font-size: .875rem; outline: none; }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--text-muted); }
  #search::-webkit-search-cancel-button { display: none; }
  .clear-btn { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); display: none; }
  .search-wrap.has-value .clear-btn { display: inline-grid; }
  kbd { padding: 3px 6px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 5px; background: var(--bg); color: var(--text-muted); font: 600 .7rem/1 Inter, system-ui, sans-serif; white-space: nowrap; }
  .search-kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .search-wrap.has-value .search-kbd { display: none; }
  .palette-backdrop { position: fixed; inset: 0; z-index: 300; background: rgba(0, 0, 0, .5); }
  .palette { position: fixed; z-index: 301; top: 12vh; left: 50%; transform: translateX(-50%); width: min(640px, calc(100vw - 24px)); max-height: 70vh; display: flex; flex-direction: column;
    overflow: hidden; background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); box-shadow: 0 24px 64px rgba(0, 0, 0, .35); }
  .palette-input { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--border); }
  .palette-input svg { flex: none; width: 18px; height: 18px; color: var(--text-muted); }
  #palette-q { flex: 1; min-width: 0; height: 52px; border: 0; outline: none; background: none; color: var(--text); font: inherit; font-size: 1rem; }
  #palette-q::placeholder { color: var(--text-muted); }
  .palette-list { margin: 0; padding: 6px; list-style: none; overflow-y: auto; }
  .palette-list li { display: flex; align-items: flex-start; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm); cursor: pointer; }
  .palette-list li[aria-selected="true"] { background: var(--accent-soft); }
  .palette-list .dot { margin-top: 6px; }
  .p-title { font-size: .9rem; font-weight: 600; line-height: 1.35; }
  .p-meta { margin-top: 2px; color: var(--text-muted); font-size: .75rem; }
  .palette-list .palette-empty { justify-content: center; padding: 22px; color: var(--text-muted); font-size: .875rem; cursor: default; }
  .palette-foot { display: flex; gap: 16px; padding: 8px 14px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: .72rem; }
  .palette-foot kbd { margin-right: 3px; }
  .filters { display: flex; gap: 8px; padding-top: 14px; overflow-x: auto; scrollbar-width: none; }
  .filter-btn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 5px 14px; border: 1px solid var(--border); border-radius: var(--radius-lg);
    background: var(--bg-card); color: var(--text-muted); font-size: .8125rem; font-weight: 500; cursor: pointer; }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .dot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 999px; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 14%, transparent); }

  .weekly { max-width: var(--read); margin: 0 auto; padding: 18px 24px 0; }
  .weekly[hidden] { display: none; }
  .weekly-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .weekly-heading { position: relative; display: flex; align-items: center; gap: 8px; min-height: 32px; }
  .weekly-title { font-size: 1.125rem; font-weight: 700; }
  .info-btn { display: grid; place-items: center; width: 22px; height: 22px; border: 1px solid currentColor; border-radius: 999px; background: none; color: var(--text-muted); font-size: .6875rem; font-weight: 700; cursor: pointer; }
  .info-btn[aria-expanded="true"] { color: var(--accent); }
  .popover { position: absolute; top: calc(100% + 6px); left: 0; z-index: 50; width: min(320px, 80vw); padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--bg-card); box-shadow: 0 24px 64px rgba(0, 0, 0, .25); color: var(--text-muted); font-size: .8125rem; line-height: 1.5; }
  .popover[hidden] { display: none; }
  .nav { display: flex; gap: 8px; }
  .nav-btn { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg-card); color: var(--text); cursor: pointer; }
  .nav-btn:disabled { cursor: default; opacity: .45; }
  .nav-btn svg { width: 16px; height: 16px; stroke-width: 2.2; }
  .rail { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding: 1px 1px 4px; scrollbar-width: none; }
  .rail::-webkit-scrollbar, .filters::-webkit-scrollbar { display: none; }
  .weekly-card { flex: 0 0 calc((100% - 20px) / 3); min-width: 220px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 7px; padding: 12px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); }
  .weekly-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; color: var(--text-muted); font-size: .75rem; }
  .rank, .count { flex: 0 0 auto; min-width: 24px; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--tag-text); text-align: center; font-weight: 700; }
  .weekly-meta { display: flex; justify-content: flex-end; gap: 4px; min-width: 0; white-space: nowrap; }
  .weekly-source { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .weekly-card-title { font-size: .875rem; line-height: 1.28; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

  .items { max-width: var(--read); margin: 0 auto; padding: 14px 24px 48px; display: flex; flex-direction: column; gap: 7px; }
  .date-label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 0 1px; padding: 8px 0 6px; border-bottom: 1px solid var(--border);
    color: var(--text-muted); font-size: .6875rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
  .count { font-size: .6875rem; letter-spacing: 0; }
  .card { content-visibility: auto; contain-intrinsic-block-size: auto 5rem; display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); }
  .card .dot { width: 9px; height: 9px; margin-top: 6px; }
  .card-body { flex: 1; min-width: 0; }
  .card-title { margin-bottom: 3px; font-size: .9375rem; font-weight: 600; line-height: 1.4; }
  .card-summary { margin-bottom: 5px; color: var(--text-muted); font-size: .8125rem; line-height: 1.5; }
  .card-meta { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--text-muted); font-size: .75rem; }
  .card-cat { flex: 0 0 auto; font-weight: 700; }
  .card-url { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-arrow { flex-shrink: 0; margin-top: 2px; color: var(--text-muted); transition: transform .15s, color .15s; }
  .card-arrow svg { width: 16px; height: 16px; }
  mark { background: var(--accent-soft); color: inherit; border-radius: 2px; }
  .back-to-top { position: fixed; right: 24px; bottom: 24px; z-index: 90; display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--accent);
    border-radius: 999px; background: var(--bg-card); color: var(--accent); cursor: pointer; box-shadow: 0 8px 24px rgba(0, 0, 0, .2); }
  .back-to-top[hidden] { display: none; }
  .back-to-top svg { width: 18px; height: 18px; }
  .card.read .card-title { color: var(--text-muted); font-weight: 500; }
  .new { flex: 0 0 auto; padding: 1px 7px; border-radius: 999px; background: var(--accent); color: var(--accent-contrast); font-size: .66rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  @media (prefers-reduced-motion: reduce) {
    .reader, .reader-backdrop, .feed, .card-arrow, .thumb { transition: none !important; }
    .rail { scroll-behavior: auto; }
  }
  .empty { padding: 60px 24px; color: var(--text-muted); text-align: center; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) {
    .icon-btn:hover { border-color: var(--border); background: var(--bg-card-hover); color: var(--accent); }
    .theme-toggle:hover, .nav-btn:not(:disabled):hover { border-color: var(--border-strong); background: var(--bg-card-hover); }
    .filter-btn:not(.active):hover { border-color: var(--border-strong); color: var(--text); }
    .card:hover, .weekly-card:hover { background: var(--bg-card-hover); border-color: var(--border-strong); }
    .card:hover .card-arrow { transform: translateX(3px); color: var(--accent); }
  }
  @media (max-width: 640px) {
    header { padding: 0 14px; }
    .subheader { padding: 8px 14px; }
    .filters { margin-right: -14px; padding-top: 10px; }
    .filter-btn { min-height: 40px; }
    .weekly, .items { padding-left: 14px; padding-right: 14px; }
    .weekly-title { font-size: .9375rem; }
    .nav { display: none; }
    .rail { margin-right: -14px; padding-right: 14px; }
    .weekly-card { flex-basis: min(82vw, 300px); }
    .card { padding: 12px; gap: 10px; }
    .card-title { font-size: .875rem; }
    .back-to-top { right: 12px; bottom: 12px; }
    .palette { top: 8px; max-height: calc(100vh - 16px); }
    .palette-foot { display: none; }
  }
  .reader-backdrop { position: fixed; inset: 0; z-index: 200; background: rgba(0, 0, 0, .45); opacity: 0; pointer-events: none; transition: opacity .18s; }
  .reader { position: fixed; top: 0; right: 0; bottom: 0; z-index: 201; width: min(820px, 100vw); display: flex; flex-direction: column;
    background: var(--bg); border-left: 1px solid var(--border); box-shadow: 0 24px 64px rgba(0, 0, 0, .3); transform: translateX(100%); visibility: hidden;
    transition: transform .22s cubic-bezier(.2, 0, 0, 1), visibility 0s .22s; }
  body.reading { overflow: hidden; }
  body.reading .reader-backdrop { opacity: calc(1 - var(--drag, 0)); pointer-events: auto; }
  body.reading .reader { transform: translateX(calc(var(--drag, 0) * 100%)); visibility: visible; transition: transform .22s cubic-bezier(.2, 0, 0, 1); }
  body.dragging .reader, body.dragging .reader-backdrop, body.dragging .feed { transition: none !important; }
  /* Phones: the feed slides aside under the reader and follows a swipe back, like a native back gesture. */
  @media (max-width: 640px) {
    .feed { transition: transform .22s cubic-bezier(.2, 0, 0, 1); }
    body.reading .feed { transform: translateX(calc(-25% * (1 - var(--drag, 0)))); }
  }
  .reader-bar { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 12px; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
  .reader-source:hover { color: var(--accent); }
  .reader-source { flex: 1; min-width: 0; color: var(--text-muted); font-size: .8125rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reader-body { position: relative; flex: 1; min-height: 0; }
  .reader-body iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
  .reader-msg { display: grid; place-content: center; gap: 14px; height: 100%; padding: 24px; color: var(--text-muted); text-align: center; }
  .reader-msg a { justify-self: center; padding: 8px 16px; border: 1px solid var(--accent); border-radius: 999px; color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<header class="feed">
  <a class="logo" href="/">Tech <span>Watch</span></a>
  <div class="controls">
    <a class="icon-btn" href="/rss.xml" title="RSS feed" aria-label="RSS feed">
      <svg viewBox="0 0 24 24"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
    </a>
    <button class="theme-toggle" id="theme" type="button" aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span class="track"><span class="thumb"></span></span>
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
<div class="subheader feed">
  <div class="search-wrap" id="search-wrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search..." aria-label="Search" autocomplete="off">
    <kbd class="search-kbd" id="search-kbd" hidden></kbd>
    <button class="icon-btn clear-btn" id="clear" type="button" aria-label="Clear search"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="filters" id="filters"></div>
</div>
<section class="weekly feed" id="weekly" hidden>
  <div class="weekly-header">
    <div class="weekly-heading">
      <h2 class="weekly-title">This week’s essentials</h2>
      <button class="info-btn" id="info" type="button" aria-expanded="false" aria-controls="info-pop" aria-label="About this selection" title="A selection of this week’s noteworthy tech news.">i</button>
      <div class="popover" id="info-pop" hidden>A selection of this week’s noteworthy tech news.</div>
    </div>
    <div class="nav">
      <button class="nav-btn" id="prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="nav-btn" id="next" type="button" aria-label="Next"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </div>
  <div class="rail" id="rail"></div>
</section>
<main class="items feed" id="items"><p class="empty">Loading articles…</p></main>
<div id="sentinel"></div>
<div class="reader-backdrop" id="reader-backdrop"></div>
<aside class="reader" id="reader" role="dialog" aria-modal="true" aria-label="Reader" aria-hidden="true">
  <div class="reader-bar">
    <button class="icon-btn" id="reader-close" type="button" aria-label="Close reader"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <a class="reader-source" id="reader-source" target="_blank" rel="noopener" title="Open the original"></a>
  </div>
  <div class="reader-body" id="reader-body"></div>
</aside>
<div class="palette-backdrop" id="palette-backdrop" hidden></div>
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Search articles" hidden>
  <div class="palette-input">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="palette-q" type="text" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list" placeholder="Search articles…" autocomplete="off" spellcheck="false">
    <kbd>Esc</kbd>
  </div>
  <ul class="palette-list" id="palette-list" role="listbox" aria-label="Results"></ul>
  <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> choose</span><span><kbd>↵</kbd> read</span><span><kbd>Esc</kbd> close</span></div>
</div>
<button class="back-to-top" id="top" type="button" aria-label="Back to top" hidden><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
<script>
const CATS = { security: 'Security', ai: 'AI', architecture: 'Architecture', sdlc: 'SDLC', regulation: 'Regulation', other: 'Other' };
const SHORT = { architecture: 'Arch' };
const ORDER = ['ai', 'architecture', 'sdlc', 'security', 'regulation', 'other'];
const ARROW = '<svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const cat = c => (c in CATS ? c : 'other');
const domain = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
const PAGE = 40;
const io = new IntersectionObserver(([e]) => { if (e.isIntersecting && limit < shown.length) { limit += PAGE; renderPage(); } }, { rootMargin: '800px' });
let items = [], filter = 'all', shown = [], limit = PAGE, generatedAt = null;

function dayLabel(iso) {
  const days = Math.round((new Date().setHours(0, 0, 0, 0) - new Date(iso + 'T00:00:00')) / 864e5);
  if (days <= 0) return 'Today';
  if (days === 1) return 'Yesterday';
  const d = new Date(iso + 'T12:00:00');
  return days < 7 ? d.toLocaleDateString('en-US', { weekday: 'long' }) : d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

function highlight(text, q) {
  const s = esc(text);
  if (!q) return s;
  const re = new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  return s.replace(re, m => `<mark>${m}</mark>`);
}

function renderFilters() {
  const counts = {};
  for (const i of items) counts[cat(i.category)] = (counts[cat(i.category)] || 0) + 1;
  $('filters').innerHTML = [`<button class="filter-btn${filter === 'all' ? ' active' : ''}" data-f="all">All</button>`]
    .concat(ORDER.map(c => `<button class="filter-btn${filter === c ? ' active' : ''}" data-f="${c}">` +
      `<span class="dot" style="--c:var(--cat-${c})"></span>${SHORT[c] || CATS[c]} (${counts[c] || 0})</button>`)).join('');
}

function renderItems(keepLimit) {
  const ql = $('search').value.trim().toLowerCase();
  $('search-wrap').classList.toggle('has-value', !!ql);
  shown = items.filter(i => (filter === 'all' || cat(i.category) === filter) &&
    (!ql || `${i.title} ${i.summary} ${i.publisher} ${domain(i.url)}`.toLowerCase().includes(ql)));
  if (!keepLimit) limit = PAGE;
  renderPage();
}

// Renders the first `limit` matches; the sentinel below the list raises it as you scroll.
function renderPage() {
  const q = $('search').value.trim();
  const counts = {}, groups = {};
  for (const i of shown) counts[i.date] = (counts[i.date] || 0) + 1;
  for (const i of shown.slice(0, limit)) (groups[i.date] ||= []).push(i);
  $('items').innerHTML = shown.length ? Object.entries(groups).map(([d, list]) => `
    <div class="date-label"><span>${dayLabel(d)}</span><span class="count">${counts[d]}</span></div>
    ${list.map(i => { const c = cat(i.category); return `
    <a class="card${readSet.has(i.url) ? ' read' : ''}" href="${esc(i.url)}" target="_blank" rel="noopener">
      <span class="dot" style="--c:var(--cat-${c})"></span>
      <div class="card-body">
        <div class="card-title">${highlight(i.title, q)}</div>
        ${i.summary ? `<p class="card-summary">${highlight(i.summary, q)}</p>` : ''}
        <div class="card-meta">${isNew(i) ? '<span class="new">New</span>' : ''}<span class="card-cat">${CATS[c]}</span><span>·</span><span class="card-url">${esc(domain(i.url))}</span></div>
      </div>
      <span class="card-arrow">${ARROW}</span>
    </a>`; }).join('')}`).join('')
    : '<p class="empty">No articles match your search.</p>';
  io.unobserve($('sentinel'));
  io.observe($('sentinel'));
}

function renderWeekly(weekly) {
  const byUrl = Object.fromEntries(items.map(i => [i.url, i]));
  const picks = (weekly?.items || []).filter(p => byUrl[p.url]);
  if (!picks.length) return;
  $('rail').innerHTML = picks.map((p, n) => { const i = byUrl[p.url]; return `
    <a class="weekly-card" href="${esc(i.url)}" target="_blank" rel="noopener" title="${esc(p.why)}">
      <div class="weekly-top"><span class="rank">${n + 1}</span>
        <span class="weekly-meta"><span class="weekly-source">${esc(i.publisher)}</span><span>· ${CATS[cat(i.category)]} · ${dayLabel(i.date)}</span></span></div>
      <div class="weekly-card-title">${esc(i.title)}</div>
    </a>`; }).join('');
  $('weekly').hidden = false;
  const rail = $('rail');
  const step = () => rail.firstElementChild.offsetWidth + 10;
  const sync = () => { $('prev').disabled = rail.scrollLeft < 4; $('next').disabled = rail.scrollLeft + rail.clientWidth >= rail.scrollWidth - 4; };
  $('prev').onclick = () => rail.scrollBy({ left: -step() });
  $('next').onclick = () => rail.scrollBy({ left: step() });
  rail.onscroll = sync;
  sync();
}

const syncThemeColor = () => document.querySelector('meta[name="theme-color"]').setAttribute('content', css('--bg'));
$('theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  localStorage.setItem('theme', t);
  syncThemeColor();
};
$('info').onclick = e => {
  e.stopPropagation();
  const open = $('info-pop').hidden;
  $('info-pop').hidden = !open;
  $('info').setAttribute('aria-expanded', open);
};
document.addEventListener('click', () => { $('info-pop').hidden = true; $('info').setAttribute('aria-expanded', false); });
$('filters').onclick = e => {
  const b = e.target.closest('.filter-btn');
  if (!b) return;
  filter = b.dataset.f;
  renderFilters();
  renderItems();
};
$('search').oninput = () => renderItems();
io.observe($('sentinel'));
addEventListener('scroll', () => { $('top').hidden = scrollY < 800; }, { passive: true });
$('top').onclick = () => scrollTo({ top: 0, behavior: 'smooth' });
$('clear').onclick = () => { $('search').value = ''; renderItems(); $('search').focus(); };

// Read and "new since last visit" state lives only in this browser.
let weekly = null;
const readSet = new Set(JSON.parse(localStorage.getItem('read') || '[]'));
const seenUntil = localStorage.getItem('seenUntil');  // the build you'd seen by the end of your last visit
const isNew = i => !!(seenUntil && i.added && i.added > seenUntil && !readSet.has(i.url));
const saveRead = () => localStorage.setItem('read', JSON.stringify([...readSet]));
function pruneRead() {
  const urls = new Set(items.map(i => i.url));
  for (const u of readSet) if (!urls.has(u)) readSet.delete(u);
  saveRead();
}
const cardFor = url => [...document.querySelectorAll('a.card')].find(a => a.getAttribute('href') === url);
function markRead(url) {
  if (!readSet.has(url)) { readSet.add(url); saveRead(); }
  const card = cardFor(url);
  card?.classList.add('read');
  card?.querySelector('.new')?.remove();
}
const rememberSeen = () => { if (generatedAt) localStorage.setItem('seenUntil', generatedAt); };
addEventListener('pagehide', rememberSeen);
document.addEventListener('visibilitychange', () => { if (document.hidden) rememberSeen(); });

// Redraws only when a new build has landed, keeping the filter, search and loaded depth.
function load() {
  return fetch('data.json', { cache: 'no-cache' }).then(r => r.json()).then(data => {
    if (data.generated_at === generatedAt) return;
    const refresh = generatedAt !== null;
    generatedAt = data.generated_at;
    items = data.items || [];
    weekly = data.weekly;
    pruneRead();
    renderFilters();
    renderWeekly(data.weekly);
    renderItems(refresh);
    if (!refresh) syncFromHash();
  });
}
let readerFor = null;

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
// Inside the article frame, the only script allowed is this one (by nonce): it reports rightward swipes to the
// page so the reader can follow the finger, and forwards Escape, j/k, ←/→ and Cmd/Ctrl+K. The frame has no same-origin access; it can only postMessage.
const SWIPE_REPORTER = `let s = null;
const send = (tw, t) => parent.postMessage({ tw, x: t && t.screenX }, '*');
addEventListener('touchstart', e => { const t = e.touches[0]; s = { x: t.screenX, y: t.screenY, ax: null }; }, { passive: true });
addEventListener('touchmove', e => {
  if (!s) return;
  const t = e.touches[0], dx = t.screenX - s.x, dy = t.screenY - s.y;
  if (!s.ax && Math.hypot(dx, dy) > 10) { s.ax = dx > Math.abs(dy) ? 'x' : 'y'; if (s.ax === 'x') send('start', { screenX: s.x }); }
  if (s.ax === 'x') { e.preventDefault(); send('move', t); }
}, { passive: false });
const end = () => { if (s && s.ax === 'x') send('end'); s = null; };
addEventListener('touchend', end); addEventListener('touchcancel', end);
addEventListener('keydown', e => {  // keys pressed while the article has focus never reach the page
  const k = e.key.toLowerCase();
  if (!e.altKey && ['escape', 'j', 'k', 'arrowleft', 'arrowright'].includes(k)) { e.preventDefault(); parent.postMessage({ tw: 'key', key: k, mod: e.metaKey || e.ctrlKey }, '*'); }
});`;

function articleDoc(i, html, nonce, why) {
  return `<!doctype html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: http: data:; media-src https:; style-src 'unsafe-inline'; script-src 'nonce-${nonce}'">
<base target="_blank"><style>
:root { color-scheme: ${document.documentElement.dataset.theme}; }
body { margin: 0; background: ${css('--bg')}; color: ${css('--text')}; font: 1.125rem/1.75 "Iowan Old Style", Charter, Georgia, serif; overflow-wrap: break-word; }
main { max-width: 680px; margin: 0 auto; padding: 40px 24px 96px; }
h1 a { color: inherit; text-decoration: none; } h1 a:hover { text-decoration: underline; text-decoration-thickness: 2px; }
.why { margin: -1.2em 0 2.4em; padding: 12px 16px; border-left: 3px solid ${css('--accent')}; border-radius: 0 8px 8px 0; background: ${css('--bg-card')}; font: .95rem/1.5 Inter, system-ui, sans-serif; }
.why b { display: block; margin-bottom: 2px; color: ${css('--accent')}; font-size: .72rem; letter-spacing: .07em; text-transform: uppercase; }
h1 { font-size: 2.1rem; line-height: 1.2; letter-spacing: -.01em; margin: 0 0 .35em; }
.src { margin-bottom: 2.4em; color: ${css('--accent')}; font: 600 .78rem/1 Inter, system-ui, sans-serif; letter-spacing: .07em; text-transform: uppercase; }
h2, h3, h4 { line-height: 1.3; margin: 1.6em 0 .5em; }
a { color: ${css('--accent')}; }
img, video { max-width: 100%; height: auto; border-radius: 8px; }
figure { margin: 1.6em 0; } figcaption { color: ${css('--text-muted')}; font-size: .85em; }
blockquote { margin: 1.4em 0; padding-left: 1em; border-left: 3px solid ${css('--border-strong')}; color: ${css('--text-muted')}; }
pre { overflow: auto; padding: 12px 14px; border-radius: 8px; background: ${css('--bg-card')}; font-size: .82em; line-height: 1.5; }
code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .88em; }
table { display: block; overflow: auto; border-collapse: collapse; font-size: .9em; } th, td { padding: 4px 8px; border: 1px solid ${css('--border')}; }
hr { border: 0; border-top: 1px solid ${css('--border')}; }
@media (max-width: 600px) { main { padding: 24px 18px 80px; } h1 { font-size: 1.6rem; } body { font-size: 1.0625rem; } }
</style><script nonce="${nonce}">${SWIPE_REPORTER}<\/script></head><body><main><h1><a href="${esc(i.url)}" target="_blank" rel="noopener" title="Open the original">${esc(i.title)}</a></h1><div class="src">${esc(domain(i.url))}</div>${why ? `<div class="why"><b>Why it matters</b>${esc(why)}</div>` : ''}${html}</main></body></html>`;
}

const readHash = url => '#read=' + encodeURIComponent(url);
let readerPushed = false;  // false when the reader was opened from a #read= link, so closing mustn't go back off the site
function openReader(i, { fromHash = false } = {}) {
  const fresh = !document.body.classList.contains('reading');
  readerFor = i.url;
  markRead(i.url);
  const why = weekly?.items?.find(p => p.url === i.url)?.why;
  $('reader-source').textContent = `${i.publisher} · ${domain(i.url)}`;
  $('reader-source').href = i.url;
  $('reader-body').innerHTML = '<div class="reader-msg">Loading the article…</div>';
  document.body.classList.add('reading');
  $('reader').setAttribute('aria-hidden', 'false');
  document.querySelectorAll('.feed, #top').forEach(el => { el.inert = true; });
  if (fromHash) { history.replaceState({ reader: true }, '', readHash(i.url)); readerPushed = false; }
  else if (fresh) { history.pushState({ reader: true }, '', readHash(i.url)); readerPushed = true; }
  else history.replaceState({ reader: true }, '', readHash(i.url));
  if (fresh) $('reader-close').focus({ preventScroll: true });
  fetch('/api/read?url=' + encodeURIComponent(i.url), { cache: 'no-store' }).then(r => r.json()).then(r => {
    if (readerFor !== i.url) return;  // another article was opened meanwhile
    const frame = document.createElement('iframe');
    if (r.content) {
      // Scripts run only by nonce (the swipe reporter); without allow-same-origin the frame can't touch this page.
      frame.sandbox = 'allow-scripts allow-popups allow-popups-to-escape-sandbox';
      frame.srcdoc = articleDoc(i, r.content, crypto.randomUUID(), why);
    } else if (r.frameable) {
      frame.sandbox = 'allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms';
      frame.referrerPolicy = 'no-referrer';
      frame.src = i.url;
      $('reader-source').textContent += ' · original page';
    } else throw new Error('unreadable');
    frame.title = i.title;
    $('reader-body').replaceChildren(frame);
  }).catch(() => {
    if (readerFor !== i.url) return;
    $('reader-body').innerHTML = `<div class="reader-msg">${why ? `<p><b>Why it matters:</b> ${esc(why)}</p>` : ''}This site doesn’t allow a reader view.<a href="${esc(i.url)}" target="_blank" rel="noopener">Read it on ${esc(domain(i.url))}</a></div>`;
  });
}
function closeReader() {
  const url = readerFor;
  readerFor = null;
  document.body.classList.remove('reading');
  $('reader').setAttribute('aria-hidden', 'true');
  document.querySelectorAll('.feed, #top').forEach(el => { el.inert = false; });
  const card = url && cardFor(url);  // back to where you were, even after j/k through several articles
  if (card) { card.focus({ preventScroll: true }); card.scrollIntoView({ block: 'nearest' }); }
  setTimeout(() => { if (!readerFor) $('reader-body').replaceChildren(); }, 250);
}
function dismiss() {
  if (readerPushed && history.state?.reader) return history.back();
  history.replaceState(null, '', location.pathname + location.search);
  closeReader();
}
// Back/forward and #read= links: the URL decides whether the reader is open and on what.
function syncFromHash() {
  const url = location.hash.startsWith('#read=') ? decodeURIComponent(location.hash.slice(6)) : null;
  const i = url && items.find(x => x.url === url);
  if (i && readerFor !== url) openReader(i, { fromHash: true });
  else if (!i && document.body.classList.contains('reading')) closeReader();
}
addEventListener('popstate', syncFromHash);
// Swipe right to close: the reader follows the finger, then closes past a third of its width or on a flick
// (judged on the finger's speed at release, px/ms).
let drag = null;
const setDrag = f => document.documentElement.style.setProperty('--drag', f);
function dragStart(x) { drag = { x, dx: 0, lx: x, lt: performance.now(), v: 0 }; document.body.classList.add('dragging'); }
function dragMove(x) {
  if (!drag) return;
  const now = performance.now();
  if (now > drag.lt) drag.v = 0.6 * drag.v + 0.4 * (x - drag.lx) / (now - drag.lt);
  drag.lx = x; drag.lt = now;
  drag.dx = Math.max(0, x - drag.x);
  setDrag(Math.min(1, drag.dx / $('reader').offsetWidth));
}
function dragEnd() {
  if (!drag) return;
  const { dx, v } = drag, flick = dx > 40 && v > 0.4;
  drag = null;
  document.body.classList.remove('dragging');
  if (dx > $('reader').offsetWidth / 3 || flick) dismiss();
  setDrag(0);  // the closed state ignores --drag; the open state springs back
}
// Touches on the reader's own chrome (the bar, messages). Framed original pages can't report touches.
let touch = null;
$('reader').addEventListener('touchstart', e => { const t = e.touches[0]; touch = { x: t.screenX, y: t.screenY, ax: null }; }, { passive: true });
$('reader').addEventListener('touchmove', e => {
  if (!touch) return;
  const t = e.touches[0], dx = t.screenX - touch.x, dy = t.screenY - touch.y;
  if (!touch.ax && Math.hypot(dx, dy) > 10) { touch.ax = dx > Math.abs(dy) ? 'x' : 'y'; if (touch.ax === 'x') dragStart(touch.x); }
  if (touch.ax === 'x') { e.preventDefault(); dragMove(t.screenX); }
}, { passive: false });
$('reader').addEventListener('touchend', () => { if (touch?.ax === 'x') dragEnd(); touch = null; });
$('reader').addEventListener('touchcancel', () => { if (touch?.ax === 'x') dragEnd(); touch = null; });
// Swipes inside the article frame arrive as messages from the swipe reporter.
addEventListener('message', e => {
  const frame = $('reader-body').querySelector('iframe');
  if (!frame || e.source !== frame.contentWindow || typeof e.data?.tw !== 'string') return;
  if (e.data.tw === 'start') dragStart(e.data.x);
  else if (e.data.tw === 'move') dragMove(e.data.x);
  else if (e.data.tw === 'end') dragEnd();
  else if (e.data.tw === 'key') onKey(e.data.key, !!e.data.mod);
});

$('reader-close').onclick = dismiss;
$('reader-backdrop').onclick = dismiss;
// j/k or →/←: next/previous article (in the reader it switches articles in place); /: search bar; Cmd/Ctrl+K: search palette.
function step(dir) {
  if (document.body.classList.contains('reading')) {
    const next = shown[shown.findIndex(i => i.url === readerFor) + dir];
    if (!next) return;
    if (shown.indexOf(next) >= limit) { limit += PAGE; renderPage(); }
    return openReader(next);
  }
  const cards = [...document.querySelectorAll('a.card')];
  const at = cards.indexOf(document.activeElement);
  const target = cards[at < 0 ? 0 : Math.min(cards.length - 1, Math.max(0, at + dir))];
  target?.focus({ preventScroll: true });
  target?.scrollIntoView({ block: 'nearest' });
}
function onKey(key, mod, e) {
  const reading = document.body.classList.contains('reading');
  if (key === 'escape' && reading) return dismiss();
  if (key === 'k' && mod) { e?.preventDefault(); return openPalette(); }
  if (mod || e?.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
  if (key === '/' && !reading) { e?.preventDefault(); $('search').focus(); }
  else if (key === 'j' || key === 'arrowright') { e?.preventDefault(); step(1); }
  else if (key === 'k' || key === 'arrowleft') { e?.preventDefault(); step(-1); }
}
addEventListener('keydown', e => onKey(e.key.toLowerCase(), e.metaKey || e.ctrlKey, e));
if (matchMedia('(pointer: fine)').matches) {
  $('search-kbd').textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘K' : 'Ctrl K';
  $('search-kbd').hidden = false;
}

// Cmd/Ctrl+K palette: find any article and open it in the reader. Works over the reader too.
const pal = { results: [], sel: 0, returnTo: null };
const LAYERS = '.feed, #top, #reader';
function openPalette() {
  if (!$('palette').hidden) return $('palette-q').select();
  pal.returnTo = document.activeElement;
  document.querySelectorAll(LAYERS).forEach(el => { el.dataset.wasInert = el.inert ? '1' : ''; el.inert = true; });
  $('palette').hidden = $('palette-backdrop').hidden = false;
  $('palette-q').value = '';
  renderPalette();
  $('palette-q').focus();
}
function closePalette(restoreFocus = true) {
  $('palette').hidden = $('palette-backdrop').hidden = true;
  document.querySelectorAll(LAYERS).forEach(el => { el.inert = el.dataset.wasInert === '1'; });
  if (restoreFocus) pal.returnTo?.focus?.({ preventScroll: true });
}
function renderPalette() {
  const q = $('palette-q').value.trim(), ql = q.toLowerCase();
  // Title matches rank above summary/publisher matches; within a rank, items stay newest first.
  const rank = i => {
    if (!ql) return 1;
    const t = i.title.toLowerCase();
    if (t.includes(ql)) return t.startsWith(ql) ? 3 : 2;
    return `${i.summary} ${i.publisher} ${domain(i.url)}`.toLowerCase().includes(ql) ? 1 : 0;
  };
  pal.results = items.map(i => [rank(i), i]).filter(([r]) => r).sort((a, b) => b[0] - a[0]).slice(0, 30).map(([, i]) => i);
  pal.sel = 0;
  $('palette-list').innerHTML = pal.results.length ? pal.results.map((i, n) => { const c = cat(i.category); return `
    <li role="option" id="p-${n}" data-n="${n}" aria-selected="${n === 0}">
      <span class="dot" style="--c:var(--cat-${c})"></span>
      <div><div class="p-title">${highlight(i.title, q)}</div><div class="p-meta">${esc(i.publisher)} · ${CATS[c]} · ${dayLabel(i.date)}</div></div>
    </li>`; }).join('') : `<li class="palette-empty">No articles match “${esc(q)}”.</li>`;
  $('palette-q').setAttribute('aria-activedescendant', pal.results.length ? 'p-0' : '');
}
function selectPalette(n, scroll = true) {
  if (!pal.results.length) return;
  pal.sel = (n + pal.results.length) % pal.results.length;
  $('palette-list').querySelectorAll('li[data-n]').forEach(li => li.setAttribute('aria-selected', +li.dataset.n === pal.sel));
  $('palette-q').setAttribute('aria-activedescendant', 'p-' + pal.sel);
  if (scroll) $('p-' + pal.sel).scrollIntoView({ block: 'nearest' });
}
function choosePalette(n = pal.sel) {
  const i = pal.results[n];
  if (!i) return;
  closePalette(false);
  openReader(i);
}
$('palette-q').addEventListener('input', renderPalette);
$('palette-q').addEventListener('keydown', e => {
  e.stopPropagation();  // keep page shortcuts (Escape closing the reader, j/k) out of the palette
  if (e.key === 'ArrowDown') { e.preventDefault(); selectPalette(pal.sel + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); selectPalette(pal.sel - 1); }
  else if (e.key === 'Enter') { e.preventDefault(); choosePalette(); }
  else if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('palette-q').select(); }
});
$('palette-list').addEventListener('click', e => { const li = e.target.closest('li[data-n]'); if (li) choosePalette(+li.dataset.n); });
$('palette-list').addEventListener('mousemove', e => { const li = e.target.closest('li[data-n]'); if (li && +li.dataset.n !== pal.sel) selectPalette(+li.dataset.n, false); });
$('palette-backdrop').addEventListener('click', () => closePalette());
document.addEventListener('auxclick', e => { const a = e.target.closest('a.card, a.weekly-card'); if (a && e.button === 1) markRead(a.getAttribute('href')); });
// Plain clicks on an article open the reader; modified and middle clicks still open the site.
document.addEventListener('click', e => {
  const a = e.target.closest('a.card, a.weekly-card');
  if (!a) return;
  if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return markRead(a.getAttribute('href'));
  const i = items.find(x => x.url === a.getAttribute('href'));
  if (!i) return;
  e.preventDefault();
  openReader(i);
});

syncThemeColor();
load().catch(() => { $('items').innerHTML = '<p class="empty">Couldn’t load the news. Try again in a bit.</p>'; });
// Builds land every ~4h: check every 15 min while visible, and when the tab comes back into view.
const check = () => { if (!document.hidden) load().catch(() => {}); };
setInterval(check, 15 * 60e3);
document.addEventListener('visibilitychange', check);
</script>
</body>
</html>
