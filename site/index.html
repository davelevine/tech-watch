<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Watch</title>
<meta name="description" content="AI, security and architecture news, summarized daily.">
<link rel="alternate" type="application/rss+xml" title="Tech Watch" href="/rss.xml">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --card:#fff; --line:#e7e5e4; --accent:#2563eb;
    --ai:#7c3aed; --security:#dc2626; --architecture:#0891b2; --sdlc:#16a34a; --regulation:#d97706; --other:#78716c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0c0a09; --fg:#e7e5e4; --muted:#a8a29e; --card:#1c1917; --line:#292524; --accent:#60a5fa;
      --ai:#a78bfa; --security:#f87171; --architecture:#22d3ee; --sdlc:#4ade80; --regulation:#fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 52rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
  h1 { margin:0; font-size:1.6rem; letter-spacing:-.02em; }
  h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:2rem 0 .75rem; }
  a { color:inherit; text-decoration:none; }
  .muted { color:var(--muted); font-size:.85rem; }
  .muted a { text-decoration:underline; }
  .weekly { display:grid; gap:.75rem; grid-template-columns:repeat(auto-fill, minmax(15rem, 1fr)); }
  .card { display:block; background:var(--card); border:1px solid var(--line); border-radius:.6rem; padding:.9rem 1rem; }
  a.card:hover { border-color:var(--accent); }
  .title { font-weight:600; line-height:1.3; }
  .why, .summary { margin:.35rem 0 0; font-size:.92rem; }
  .meta { display:flex; gap:.5rem; align-items:center; font-size:.78rem; color:var(--muted); margin-top:.4rem; }
  .tag { font-weight:600; text-transform:uppercase; letter-spacing:.05em; font-size:.7rem; }
  .controls { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:1.5rem; }
  .controls input { flex:1 1 12rem; padding:.45rem .7rem; border:1px solid var(--line); border-radius:.5rem; background:var(--card); color:var(--fg); font:inherit; }
  .controls button { padding:.4rem .75rem; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--fg); font:inherit; font-size:.85rem; cursor:pointer; }
  .controls button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .list { display:grid; gap:.5rem; }
  .empty { color:var(--muted); padding:2rem 0; text-align:center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>📡 Tech Watch</h1>
    <span class="muted"><span id="updated"></span> · <a href="/rss.xml">RSS</a></span>
  </header>
  <section id="weekly-section" hidden>
    <h2>Essentials of the week</h2>
    <div class="weekly" id="weekly"></div>
  </section>
  <div class="controls" id="controls">
    <input id="q" type="search" placeholder="Search titles and summaries…" aria-label="Search">
  </div>
  <div id="days"><p class="empty">Loading…</p></div>
</main>
<script>
const LABELS = { all: 'All', ai: 'AI', security: 'Security', architecture: 'Architecture', sdlc: 'SDLC', regulation: 'Regulation', other: 'Other' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const tag = c => `<span class="tag" style="color:var(--${esc(c)})">${esc(LABELS[c] || c)}</span>`;
const dayName = d => new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
let items = [], category = 'all';

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const shown = items.filter(i => (category === 'all' || i.category === category) &&
    (!q || `${i.title} ${i.summary} ${i.publisher}`.toLowerCase().includes(q)));
  const days = {};
  for (const i of shown) (days[i.date] ||= []).push(i);
  document.getElementById('days').innerHTML = shown.length ? Object.entries(days).map(([d, list]) => `
    <h2>${esc(dayName(d))}</h2>
    <div class="list">${list.map(i => `
      <a class="card" href="${esc(i.url)}" target="_blank" rel="noopener">
        <div class="title">${esc(i.title)}</div>
        <p class="summary">${esc(i.summary)}</p>
        <div class="meta">${tag(i.category)}<span>${esc(i.publisher)}</span></div>
      </a>`).join('')}</div>`).join('') : '<p class="empty">Nothing matches.</p>';
}

fetch('data.json', { cache: 'no-cache' }).then(r => r.json()).then(data => {
  items = data.items;
  document.getElementById('updated').textContent = 'Updated ' + new Date(data.generated_at).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  const byUrl = Object.fromEntries(items.map(i => [i.url, i]));
  const picks = (data.weekly?.items || []).filter(p => byUrl[p.url]);
  if (picks.length) {
    document.getElementById('weekly').innerHTML = picks.map(p => { const i = byUrl[p.url]; return `
      <a class="card" href="${esc(i.url)}" target="_blank" rel="noopener">
        <div class="title">${esc(i.title)}</div>
        <p class="why">${esc(p.why)}</p>
        <div class="meta">${tag(i.category)}<span>${esc(i.publisher)}</span></div>
      </a>`; }).join('');
    document.getElementById('weekly-section').hidden = false;
  }
  const present = new Set(items.map(i => i.category));
  const controls = document.getElementById('controls');
  for (const c of Object.keys(LABELS).filter(c => c === 'all' || present.has(c))) {
    const b = document.createElement('button');
    b.textContent = LABELS[c];
    b.setAttribute('aria-pressed', c === category);
    b.onclick = () => { category = c; controls.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); };
    controls.append(b);
  }
  document.getElementById('q').oninput = render;
  render();
}).catch(() => { document.getElementById('days').innerHTML = '<p class="empty">Couldn\'t load the news. Try again in a bit.</p>'; });
</script>
</body>
</html>
